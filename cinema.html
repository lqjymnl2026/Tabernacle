<script src="assets.js"></script>
<script>
var VIDEOS=[
  ['讲道','⛪','王牧 · 登山宝训（一）：八福','48:20','2.4万次观看','#2b1a5e','#4f46e5','watch.html?vid=2'],
  ['讲道','⛪','李牧 · 登山宝训（二）：盐与光','41:05','1.8万次观看','#1f1555','#3b82f6','watch.html?vid=8'],
  ['查经','📖','罗马书 8 章 · 互动查经课','55:40','6,980次观看','#123b66','#0ea5e9','watch.html?vid=5'],
  ['查经','📖','马太福音 5 章 · 八福查经','42:12','5,240次观看','#123b66','#06b6d4','watch.html?vid=9'],
  ['圣经电影','🎥','《耶稣传 · 约翰福音》','2:46:00','1.2万次观看','#3b0d1e','#e63946','watch.html?vid=1'],
  ['圣经电影','🎥','《十诫 · 摩西》精选片段','18:10','1.1万次观看','#3b0d1e','#c026d3','watch.html?vid=7'],
  ['见证','💛','在低谷中，神仍然信实','12:05','8,620次观看','#5c3a0e','#d97706','watch.html?vid=3'],
  ['见证','💛','从拜偶像到归信基督','15:40','7,310次观看','#5c3a0e','#f59e0b','watch.html?vid=10'],
  ['敬拜','🎶','诗篇 23 · 全地敬拜现场','32:15','1.5万次观看','#3d1250','#a21caf','watch.html?vid=4'],
  ['敬拜','🎶','圣诗之夜 · 赞美会','58:30','1.9万次观看','#3d1250','#7c3aed','watch.html?vid=11'],
  ['青年','🔥','青年特会：为什么神不回答我的祷告？','42:30','9,240次观看','#12404a','#0d9488','watch.html?vid=6'],
  ['青年','🔥','恋爱与信仰：青年问答','36:50','7,880次观看','#12404a','#0891b2','watch.html?vid=12']
];
var currentCat='全部',currentQ='';
function render(){
  var list=VIDEOS.filter(function(v){return (currentCat==='全部'||v[0]===currentCat)&&(!currentQ||v[2].indexOf(currentQ)>-1);});
  document.getElementById('cinemaGrid').innerHTML=list.map(function(v){
    return '<a class="vcard" href="'+v[7]+'"><div class="vthumb" style="background:linear-gradient(135deg,'+v[5]+','+v[6]+')"><span class="cat">'+v[0]+'</span><span class="play">▶</span><span class="dur">'+v[3]+'</span><span style="font-size:34px">'+v[1]+'</span></div><div class="vbody"><h4>'+v[2]+'</h4><div class="meta"><span>'+v[4]+'</span></div></div></a>';
  }).join('');
  document.getElementById('emptyTip').textContent=list.length?'':'没有找到相关影片，试试其他关键词。';
}
document.querySelectorAll('#catTags button').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('#catTags button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');
  currentCat=b.dataset.cat;render();
});});
function doSearch(){currentQ=document.getElementById('searchInput').value.trim();render();}
document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
render();
</script>
</body>
