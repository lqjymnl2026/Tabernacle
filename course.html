<script>
var COURSES={
 '1':['🌱','信仰入门 · 认识神','L1 · 信仰入门','张牧 / 王教授','12 课时 · 约 6 小时','3,240 人学习','从零开始认识那位创造天地的神：祂是谁、祂做了什么、祂如何与我们相遇。','1-12'],
 '2':['📖','新约概论','L2 · 圣经基础','李教授','14 课时 · 约 7 小时','1,880 人学习','一卷一卷走过新约 27 卷：福音书、使徒行传、保罗书信与启示录的整体脉络。','1-14'],
 '3':['⚖️','因信称义 · 救恩论','L3 · 神学基础','王教授','8 课时 · 约 4 小时','1,186 人学习','深入罗马书 3-5 章与系统神学的救恩论：称义、成圣与确据。','1-8'],
 '4':['🙏','祷告与读经习惯','L1 · 信仰入门','李姊妹','10 课时 · 约 5 小时','2,860 人学习','建立稳定的灵修生活：祷告的方法、读经的框架与属灵操练。','1-10'],
 '5':['📜','旧约概论','L2 · 圣经基础','陈教授','14 课时 · 约 7 小时','1,940 人学习','从创造到先知：旧约 39 卷的历史脉络与救赎主线。','1-14'],
 '6':['✝️','基督论','L3 · 神学基础','张牧','9 课时 · 约 4.5 小时','1,020 人学习','耶稣是谁？道成肉身、神人二性与救赎的奥秘。','1-9'],
 '7':['🎤','讲道学基础','L4 · 服事装备','张牧','10 课时 · 约 5 小时','642 人学习','释经讲道的方法：从经文到信息，从信息到讲章。','1-10'],
 '8':['🔥','青年事工导论','L4 · 服事装备','Pastor David','9 课时 · 约 4.5 小时','518 人学习','认识这一代青年：文化、危机与福音的切入点。','1-9']
};
var id=new URLSearchParams(location.search).get('id')||'1';
var c=COURSES[id]||COURSES['1'];
document.title='云会幕 · '+c[1];
document.getElementById('cIcon').textContent=c[0];
document.getElementById('cTitle').textContent=c[1];
document.getElementById('cDesc').textContent=c[6];
document.getElementById('cMeta').innerHTML='<span>🏷️ '+c[2]+'</span><span>👨‍🏫 '+c[3]+'</span><span>⏱️ '+c[4]+'</span><span>👥 '+c[5]+'</span>';
document.getElementById('lecturer').textContent=c[3]+'：课程由 '+c[3].split(' / ')[0]+' 主讲，结合视频讲道、互动测验与讨论作业，帮助你扎实装备。';
var range=c[7].split('-'),start=parseInt(range[0]),end=parseInt(range[1]);
var lessons='';
  var titles=['认识独一真神','神的属性','神的创造','人的堕落','救恩的预备','耶稣基督','十字架与复活','圣灵的工作','回应与委身','活在教会中','祷告的操练','读经的方法'];
  for(var i=start;i<=end;i++){
    var done=(i>start&&i<=start+1)?' done':'';
    var title=titles[i-1]||'课程主题 '+i;
    lessons+='<a class="lesson '+(i===start?'now':'')+done+'" href="lesson.html?id='+id+'&l='+i+'"><span class="l-n">'+(i===start?'▶':i)+'</span><div class="l-body"><b>第 '+i+' 课 · '+title+'</b><small>'+c[0]+' · 视频课</small></div><span class="l-time">30:00</span></a>';
  }
  document.getElementById('lessonList').innerHTML=lessons;
</script>
